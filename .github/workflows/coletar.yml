# Robô do NEWs: busca notícias e números a cada 3 horas e salva no repositório.
# Também pode ser rodado na hora: aba "Actions" do GitHub → "Coletar notícias" → "Run workflow"
# (ou no terminal: gh workflow run coletar.yml).
name: Coletar notícias

on:
  schedule:
    # A cada 3 horas, no minuto 17 (o minuto 0 é o mais congestionado no GitHub). Horário em UTC:
    # no horário de Brasília roda às 00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17 e 21:17.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write # para salvar os arquivos de dados no repositório

concurrency:
  group: coleta # nunca duas coletas ao mesmo tempo
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Coletar notícias e números
        run: npm run coletar

      - name: Salvar dados novos
        run: |
          git config user.name "NEWs (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data cache
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última coleta."
            exit 0
          fi
          git commit -m "Atualiza notícias e números ($(TZ=America/Sao_Paulo date '+%d/%m %H:%M'))"
          # Se alguém salvou algo no meio tempo, junta antes de enviar
          git pull --rebase origin main
          git push origin HEAD:main
