<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEWs</title>
  <meta name="description" content="Política, Economia, Mercado e IA — só o que importa, de fontes brasileiras e oficiais.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>NEWs</h1>
    <p class="subtitulo">Só o essencial de hoje</p>
  </header>

  <main id="conteudo">
    <section class="aba" id="aba-politica" data-aba="politica">
      <h2>Política do Brasil</h2>
      <p class="vazio">Em construção.</p>
    </section>
    <section class="aba" id="aba-economia" data-aba="economia" hidden>
      <h2>Economia</h2>
      <p class="vazio">Em construção.</p>
    </section>
    <section class="aba" id="aba-mercado" data-aba="mercado" hidden>
      <h2>Mercado e bolsa</h2>
      <p class="vazio">Em construção.</p>
    </section>
    <section class="aba" id="aba-ia" data-aba="ia" hidden>
      <h2>Inteligência artificial</h2>
      <p class="vazio">Em construção.</p>
    </section>
  </main>

  <nav class="abas" aria-label="Abas">
    <button type="button" data-aba="politica" aria-current="page">Política</button>
    <button type="button" data-aba="economia">Economia</button>
    <button type="button" data-aba="mercado">Mercado</button>
    <button type="button" data-aba="ia">IA</button>
  </nav>

  <script src="app.js" type="module"></script>
</body>
</html>
