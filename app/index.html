<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEWs</title>
  <meta name="description" content="Política, Economia, Mercado e IA — só o que importa, de fontes brasileiras e oficiais.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
  <!-- Instalação na tela inicial -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icones/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NEWs">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fontes/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <h1 class="marca">NEWs</h1>
      <div class="topo-acoes">
        <button type="button" class="botao-icone" id="botao-atualizar" aria-label="Atualizar notícias" title="Atualizar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a href="#salvos" class="botao-icone" id="botao-salvos" aria-label="Notícias salvas" title="Salvos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="contador" id="contador-salvos" hidden></span>
        </a>
      </div>
    </div>
    <div class="topo-sub">
      <p class="data-hoje" id="data-hoje"></p>
      <p class="atualizado" id="atualizado" aria-live="polite">Carregando…</p>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <!-- Preenchido pelo app.js -->
  </main>

  <nav class="abas" aria-label="Abas">
    <a href="#politica" data-aba="politica">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10m4 11V10m6 11V10m4 11V10M2 10h20L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Política</span><span class="pendentes" hidden></span>
    </a>
    <a href="#economia" data-aba="economia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Economia</span><span class="pendentes" hidden></span>
    </a>
    <a href="#mercado" data-aba="mercado">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8m0 0h-5m5 0v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Mercado</span><span class="pendentes" hidden></span>
    </a>
    <a href="#ia" data-aba="ia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>IA</span><span class="pendentes" hidden></span>
    </a>
  </nav>

  <dialog id="dialogo-termo" class="folha" aria-labelledby="termo-titulo">
    <div class="folha-conteudo">
      <div class="folha-topo">
        <h2 id="termo-titulo"></h2>
        <button type="button" class="botao-icone" id="fechar-termo" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="termo-explicacao"></p>
      <h3>Por que importa</h3>
      <p id="termo-importa"></p>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
